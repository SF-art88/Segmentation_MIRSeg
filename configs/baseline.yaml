# Shared setting-aware baseline used to initialize MIRSeg.
model:
  name: baseline
  backbone:
    stem_channels: 32
    encoder_channels: [64, 96, 128, 160]
    decoder_channels: 96
    dropout: 0.0
  heads:
    num_classes_pre: 4
    num_classes_post: 5

data:
  manifest: examples/manifest_template.csv  # TODO: replace with your manifest CSV
  train_split: train
  val_split: val
  patch_size: [96, 96, 96]
  positive_crop_probability: 0.7
  percentile_clip: [0.5, 99.5]
  normalize_nonzero: true
  ignore_index: -1
  label_maps:
    pre: {0: 0, 1: 2, 2: 1, 4: 3}
    post: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}

runtime:
  seed: 42
  device: cuda
  num_workers: 0
  num_threads: 4
  sliding_window_roi: [96, 96, 96]
  sliding_window_overlap: 0.5

train:
  output_dir: experiments/baseline
  batch_size: 2
  num_epochs: 50
  lr: 3.0e-4
  weight_decay: 1.0e-4
  eps: 1.0e-8
  min_lr: 1.0e-6
  max_grad_norm: 5.0
  curriculum:
    full_only_epochs: 50
